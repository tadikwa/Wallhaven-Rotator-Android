name: Android release instructions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-signing-required:
    runs-on: ubuntu-latest
    steps:
      - name: Signing remains on the owner's PC
        run: |
          echo "Release signing is local only. No signing key or password is stored in GitHub."
          echo "Follow SIGNING.md and RELEASING.md to build, verify and upload only the signed APK and public update metadata."
