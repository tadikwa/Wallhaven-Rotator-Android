name: Android validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Unit tests and compilation
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Explain local signing
        run: echo "Validation only. Installable APKs are signed locally with the persistent key."

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Wallhaven-Rotator-Unit-Tests
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
