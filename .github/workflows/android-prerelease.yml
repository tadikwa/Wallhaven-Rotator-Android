name: Android prerelease build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Unit tests and debug APK
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare debug artifact
        shell: bash
        run: |
          VERSION_NAME="$(tr -d '\r\n' < VERSION)"
          APK_NAME="Wallhaven-Rotator-Android-v${VERSION_NAME}.apk"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/${APK_NAME}"
          cd release
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wallhaven-Rotator-Android-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
